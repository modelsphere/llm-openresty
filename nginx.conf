worker_processes  20;

error_log  logs/error.log  info;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # sid / src / mode / peer 由 session_route.conf 的 access_by_lua 填充。
    # session_log 只在 18080 (Kimi session-routing) server 块内启用，
    # 避免其它 server (如 llm-gateway-1 的 443/80) 引用未初始化的 routed_* 变量产生 warn 噪声。
    log_format  session_log  '$remote_addr - [$time_local] "$request" '
                             'rid=$request_id '
                             'sid="$routed_session_id" src=$routed_source mode=$routed_mode '
                             'peer=$routed_peer fwd="$upstream_http_x_routed_peer" upstream="$upstream_addr" '
                             'status=$status bytes=$body_bytes_sent rt=$request_time urt=$upstream_response_time uht=$upstream_header_time';

    # 不在 http{} 显式声明 access_log；nginx 内置默认 access_log logs/access.log combined。
    # 18080 (Kimi session-routing) server 块用 access_log ... session_log; 覆盖默认。
    # 其它 server (如 llm-gateway-1 的 443/80) 仍走默认 combined 格式，写入同一份 logs/access.log。

    sendfile        on;
    keepalive_timeout  65;

    # lua_shared_dict 全部在 conf.d/session_route.conf 里声明（集中管理）

    # Session-based routing configs live here
    include conf.d/*.conf;

    # Nginx site configs (gateway-host 有 llm-gateway-1.example.com 的 443 server block；
    # 其他机器没有此目录也不会报错 — glob 匹配空集时 nginx 静默跳过)
    include /etc/nginx/sites-enabled/*;
}
