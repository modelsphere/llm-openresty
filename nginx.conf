worker_processes  20;
worker_rlimit_nofile  4096;

# ★ 机器级配置：bodylog listener 地址（session_base.conf init_worker 读 os.getenv）★
# 默认网段(gateway-host/31/34)= 10.0.0.1；cloud-b 网(gateway-host/12)改成 10.0.0.2。
# Unset or empty => body logging is OFF (no frames are built and nothing is sent).
# There is no built-in fallback address: silently shipping request bodies to a
# host this deployment never named is worse than not logging at all.
env BODYLOG_LISTENER_HOST=10.0.0.1;
env BODYLOG_LISTENER_PORT=9999;

# Path to the API key file read by lua/api_keys.lua. The keys themselves live in
# that file (on Kubernetes: a mounted Secret), never here and never in the image.
#
# Only the PATH goes through the environment, and only because it is static
# configuration. The keys deliberately do not: nginx reads `env` declarations
# only at master startup and `-s reload` does not re-read them, so a key held in
# an environment variable could not be rotated without killing the master and
# every in-flight stream with it. A reload re-executes init_by_lua, which
# re-reads the file -- so rotation costs one graceful reload.
#
# Leave this unset to use the built-in default (/etc/openresty/api-keys/keys).
#
# No readable key file => authentication is OFF and every request is allowed
# through. That is a deliberate fail-open (a misconfigured Secret returning 401
# for the whole site is worse than a brief window without auth), but it is never
# silent: the engine logs an error at init and /_health_status reports
# _meta.api_keys_configured=false for monitoring to alert on.
env OPENRESTY_API_KEYS_FILE;

error_log  logs/error.log  info;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # sid / src / mode / peer 由 session_route.conf 的 access_by_lua 填充。
    # session_log 只在 18080 (Kimi session-routing) server 块内启用，
    # 避免其它 server (如 llm-gateway-1 的 443/80) 引用未初始化的 routed_* 变量产生 warn 噪声。
    # JSON 格式(2026-07)：便于 Loki/Grafana `| json` 直接解析。
    #   - escape=json 必加：request/upstream 里的引号/反斜杠会破坏整行 JSON。
    #   - status/reqlen/bytes/rt 恒有值 → JSON number(不加引号)，Grafana 分位数免转型。
    #   - urt/uht/upstream 重试时是逗号分隔多值/可能为空 → 当字符串(加引号)，
    #     Loki 侧用 `| unwrap` 拆首值再做数值运算。
    #   - time_iso8601 取代 time_local(Loki 解析更稳)；额外加 method 便于过滤。
    log_format  session_log  escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request":"$request",'
          '"method":"$request_method",'
          '"rid":"$request_id",'
          '"sid":"$routed_session_id",'
          '"src":"$routed_source",'
          '"mode":"$routed_mode",'
          '"peer":"$routed_peer",'
          '"fwd":"$upstream_http_x_routed_peer",'
          '"upstream":"$upstream_addr",'
          '"status":$status,'
          '"reqlen":$request_length,'
          '"bytes":$body_bytes_sent,'
          '"rt":$request_time,'
          '"urt":"$upstream_response_time",'
          '"uht":"$upstream_header_time"'
        '}';

    # 不在 http{} 显式声明 access_log；nginx 内置默认 access_log logs/access.log combined。
    # 18080 (Kimi session-routing) server 块用 access_log ... session_log; 覆盖默认(JSON)。
    # 其它 server (如 llm-gateway-1 的 443/80) 仍走默认 combined 格式，写入同一份 logs/access.log
    #   → gateway-host 那一台 access.log 会 JSON/combined 混排，Loki 侧 `| json | __error__=""`
    #     丢掉非 JSON 行即可；ts31/gw10/chat 无 443 server，access.log 是纯 JSON。

    sendfile        on;
    keepalive_timeout  65;

    # lua_shared_dict：K2.5 主路由 + 全局共享的（ttft_stat/tps_stat/api_keys/reject_stat）在
    # conf.d/session_route.conf 声明；各 per-model 路由自己那 6 个在各自 session_route_<model>.conf 里

    # Lua 引擎库路径:session_route.conf 的 init_by_lua_block{ require "router" } 从这里加载
    # conf.d/lua/*.lua(util/reqtransform/bodylog/route/ttft/tps/access/timers/debug_endpoints)。
    # 多候选兼容不同 nginx prefix 解析($prefix 可能落在 nginx/ 或 nginx/conf/);首个命中即用,
    # 结尾 ;; 追加内置默认 path(resty.* 等系统模块仍走默认)。改代码只动 conf.d/lua/,不动本行。
    lua_package_path '$prefix/conf/conf.d/lua/?.lua;$prefix/conf.d/lua/?.lua;;';

    # Session-based routing configs live here
    include conf.d/*.conf;          # 框架基座 session_base.conf(baked into image)
    include conf.d/routes/*.conf;   # per-model 路由(autoconfig 生成、挂 ConfigMap 到 conf.d/routes/)

    # Nginx site configs (gateway-host 有 llm-gateway-1.example.com 的 443 server block；
    # 其他机器没有此目录也不会报错 — glob 匹配空集时 nginx 静默跳过)
    include /etc/nginx/sites-enabled/*;
}
