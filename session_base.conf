# openresty 框架基座 session_base.conf（baked into image）——所有路由共用的 dicts + upstream + init 框架 + 全局 _G.* 默认。
# 具体路由(server + peers)在各自 session_route_<model>.conf(conf.d/routes/,autoconfig 生成挂载)。
# Session-based routing to vllm backends.
# Mirrors litellm's session_id extraction chain:
#   1. header  x-litellm-session-id
#   2. header  x-claude-code-session-id
#   3. header  x-session-id              (generic name; best chance to survive upstream-gateway / other upstream header whitelists)
#   4. body    metadata.session_id       (also litellm_metadata.session_id)
#   5. body    metadata.user_id.session_id    (dict form)
#   6. body    metadata.user_id          (JSON string containing session_id)
#   7. body    metadata.user_id          (plain string used as-is)
#   8. body    user                      (OpenAI-standard field; proxies preserve JSON body so this survives;
#                                          可通过 _G.DISABLE_BODY_USER_AFFINITY=true 关闭此来源)
# Include this file from the `http { }` block of nginx.conf.

# ── DNS resolver（cosocket 解析 hostname 用）──
# bodylog logger（resty.logger.socket）连的 BODYLOG_LISTENER_HOST 若是域名(k8s Service 名如 "bodylog"),
# cosocket 必须有 resolver 才能解析,否则 flush 静默失败、日志发不出去。local=on 自动读 /etc/resolv.conf
# 的 nameserver(k8s 里=kube-dns),无需硬编码集群 DNS IP。生产用 IP 时此指令无害(不触发解析)。
resolver local=on ipv6=off valid=30s;

# ── shared dicts —— 全局共用(ttft_stat/tps_stat/api_keys/reject_stat)+ K2.5 历史无后缀名(active_conns 等,被 session_route_kimi-k2.5.conf 的 factory 引用)。其他 per-model 路由在各自 conf 声明带 _<route> 后缀的 dict。──
lua_shared_dict active_conns 4m;   # least_conn 计数器（peer 数 × 40B key × LRU 余量）
lua_shared_dict ttft_stat  256k;   # TTFT 限流:所有路由共用一份,key 带 <route>[:<model>] 前缀(EWMA / 窗口直方图 / 探测计数 / __off)
lua_shared_dict tps_stat   256k;   # TPS 限流(解码速率):同 ttft_stat 结构,key 带 <route>[:<model>] 前缀(EWMA / 窗口直方图 / 探测计数 / nousage / __off)
lua_shared_dict cluster_avg 16k;   # 5min 滑动窗：10 个 30s 桶，每桶存 sum(active_conns) 快照（用于 429 判断）
lua_shared_dict lc_locks    1m;    # resty.lock 互斥
lua_shared_dict bad_peers   1m;    # 健康检查 ban 列表（TTL=300s）
lua_shared_dict api_keys    1m;    # API key 鉴权缓存（所有路由共用同一份，统一管理）
lua_shared_dict bodylog_ctl 1m;    # body-log 配置 + 计数器（enabled / sample_pct / writes / drops / last_log_ts）
lua_shared_dict cch_ctl     1m;    # cch-strip 配置 + 计数器（enabled / stripped_total / parsed_total）
lua_shared_dict reject_stat 128k;  # 429 限流计数器：key = "<route>:<reason>"（reason=concurrency/ttft/tps），/_429_status 聚合；跨 reload 存活、进程重启清零
# body-log 异步落盘走 lua-resty-logger-socket（cosocket，非阻塞）→ 本机 TCP 9999 listener →
# /mnt/nvme0n1/nginx/bodylog/YYYY-MM-DD.jsonl 单文件。完全不阻塞 worker，wire 协议是长度前缀二进制帧
# （[u32 total_len][u16 meta_len][meta][u32 req_len][req][u32 resp_len][resp]）。
# 详见 bodylog-listener-go/main.go（生产）/ bodylog_listener.py（fallback）/ vendor/resty/logger/socket.lua。

upstream vllm_backends {
    # placeholder; actual peer picked in access_by_lua_block and stashed into ngx.ctx;
    # balancer_by_lua_block calls set_current_peer, and on retry picks from fallback list.
    # 所有路由共用一个 balancer 函数，按 ngx.ctx.route_opts.active_conns_dict 区分计数器。
    server 0.0.0.1:1;
    balancer_by_lua_block { _G.do_balancer() }
}

# Lua helper: litellm-compatible session_id extractor.
# Loaded once per worker via init_by_lua; reused by access_by_lua_block.
init_worker_by_lua_block {
    -- per-worker random seed so different workers don't pick in lockstep
    math.randomseed(ngx.now() * 1000 + ngx.worker.pid())

    -- (K2.5 主路由的 register_route 已拆到 session_route_kimi-k2.5.conf,per-model 懒注册模式。)

    -- body-log: 用 lua-resty-logger-socket 异步发到 listener（默认本机 9999）。
    -- 完全 cosocket 非阻塞——log() 瞬时返回，后台协程批量 send；
    -- listener 挂时数据进 worker buffer，drop_limit 满才丢，不阻塞请求。
    -- listener 地址：机器级，从 nginx.conf 的 env 指令读（env BODYLOG_LISTENER_HOST=...）。
    -- 必须在 init_worker 读 os.getenv —— env 指令的值要 worker 起来后才稳定可见，
    -- master 期(init_by_lua)读不到。不设 env 的机器回落默认 gateway-host（10.0.0.1）。
    _G.BODYLOG_LISTENER_HOST = os.getenv("BODYLOG_LISTENER_HOST") or "10.0.0.1"
    _G.BODYLOG_LISTENER_PORT = tonumber(os.getenv("BODYLOG_LISTENER_PORT")) or 9999
    local logger = require "resty.logger.socket"
    if not logger.initted() then
        local ok, lerr = logger.init({
            host         = _G.BODYLOG_LISTENER_HOST,
            port         = _G.BODYLOG_LISTENER_PORT,
            sock_type    = "tcp",
            flush_limit  = 4096,        -- buffer 满 4KB 立刻 flush
            drop_limit   = 268435456,   -- worker buffer 满 256MB 后 drop（吸收瞬时峰值）
            timeout      = 1000,        -- 1s connect/send 超时
            max_retry_times = 3,
            retry_interval  = 100,      -- 100ms 重连间隔
            pool_size       = 10,
            periodic_flush  = 1,        -- 即使 buffer 没满也每 1s flush 一次（避免低流量时残留）
        })
        if not ok then
            ngx.log(ngx.ERR, "bodylog logger init failed: ", lerr)
        else
            ngx.log(ngx.NOTICE, "bodylog logger initted on worker ", ngx.worker.id(),
                    " → ", _G.BODYLOG_LISTENER_HOST, ":", _G.BODYLOG_LISTENER_PORT)
        end
    end
}

init_by_lua_block {
    -- 引擎代码全部搬到 lua/ 模块(见 tools/openresty-refactor/split_lua.py);
    -- 这里只留 require + 路由数据/全局可调参数(便于 ops 编辑 + chat mock-splice)。
    require "router"


    -- 健康探针默认路径(per-route 可用 opts.health_probe_path 覆盖;定义这一处,别处引用不写死)
    _G.DEFAULT_HEALTH_PROBE_PATH = "/v1/models"

    -- (K2.5 的 peer 列表已随 K2.5 路由拆到 session_route_kimi-k2.5.conf 的 factory 内。
    --  各 per-model 路由的 peers 在自己的 session_route_<model>.conf 的 register_route factory 里配。)

    -- ── 并发限制 ──
    -- 总并发上限 = sum(p[5] for p in 当前活跃优先级层中未 banned 的 peer)
    -- 单 peer 上限 p[5] 缺省时回退到 MAX_CONCURRENCY_PER_PEER 这个全局默认值。
    -- 超过 → 直接 429 拒绝（不占用 upstream 队列）。
    _G.MAX_CONCURRENCY_PER_PEER = 20

    -- 并发实时阈值放大倍数:rt_sum >= limit * rt_limit_factor 才判过载 429。
    -- 全局默认 1×(2026-07-02 从 2× 改 1:realtime 直接以 limit 为界,不留 2 倍突发余量);
    -- 每路由可在 factory 用 rt_limit_factor 覆盖(想更宽松设 2/3)。
    -- 注:hit_avg(avg_5min 那路)已暂时禁用,只用 realtime 判过载(见 do_route)。
    _G.RT_LIMIT_FACTOR = 1

    -- ── TTFT 限流开关 + 全局阈值 ──
    -- _G.TTFT_ENABLED:总开关(config 级,reload 生效)。true=对所有路由生效(用下方全局阈值,
    --   单路由可在 factory 里 ttft_limit_ms 覆盖);false=一刀切关,完全退回基于并发的旧逻辑。
    -- 另有每路由免-reload 热开关 POST /_ttft_toggle?on=0|1。两者任一关 = 该路由关(见 ttft_dict_if_on)。
    -- ttft_stat dict 在文件顶部统一声明、所有路由共用 → 不需要每路由再配 dict / 阈值。
    _G.TTFT_ENABLED  = true
    -- 全局默认 TTFT 阈值(ms):池级 EWMA 超它 → 限流。各机型/模型基线差异大,这是个"只抓严重过载"的
    -- 保守默认,建议按 /_ttft_status 实测 EWMA 调小;单路由可在 factory 里 ttft_limit_ms 覆盖。
    _G.TTFT_LIMIT_MS = 30000
    -- TTFT 聚合:每 ttft_window 秒一个窗口,窗口内取 P80(直方图),再把每窗口 P80 折进 EWMA。
    -- 窗口内用 P80(不是均值)→ 抓"≥20% 请求慢"的尾部;EWMA 跨窗口平滑;按秒固定节奏反应。
    _G.TTFT_WINDOW   = 20                       -- 聚合窗口(秒);20s 比 10s 单窗口攒更多样本,P80 更稳(轻载时尤甚)
    -- P80 直方图桶上界(ms):落在哪个桶 incr 哪个;P80 取累计越过 80% 的桶上界(粗粒度,够比阈值用)。
    -- 覆盖到 ~80s;超出进 overflow 桶,代表值取末桶×2。可按实测 TTFT 分布调整。
    _G.TTFT_BUCKETS_MS = {250, 500, 1000, 1500, 2000, 3000, 5000, 8000, 12000, 20000, 30000, 50000, 80000}

    -- ── TPS 限流(解码速率)开关 + 全局阈值 ──
    -- 与 TTFT 机制完全对称(池级 EWMA + 半开探测熔断),只差三处语义:
    --   ① 指标 = 单请求解码速率 tps = completion_tokens/(总耗时-TTFT),低=过载(TTFT 是高=过载)
    --   ② 窗口聚合取 P20(低尾),不是 P80(高尾)—— TPS 的"坏样本"在低端
    --   ③ 判定用 ewma <= 下限(跌破),不是 >=
    -- _G.TPS_ENABLED:config 级总开关(reload 生效);另有每路由免-reload 热开关 /_tps_toggle?on=0|1。
    _G.TPS_ENABLED   = true
    -- 全局默认下限(tokens/sec):nil = 无全局默认 = 全路由默认关(纯 opt-in),零行为变化。
    -- 这与 TTFT 不同(_G.TTFT_LIMIT_MS=30000 默认开)——机型/模型解码基线差异大(H200 GLM ~120 vs
    -- 别的 ~40 tok/s),一刀切全局下限会误触发 429,故只逐路由在 factory 配 tps_limit_tps 才生效。
    -- 注意:Lua 里 _G.TPS_LIMIT_TPS=nil 等于该 key 不存在,本行纯文档作用;真正的 opt-in 闸门在
    -- register_route 默认值(tps_limit_tps 默认 nil)+ tps_dict_if_on 的 `if not opts.tps_limit_tps`。
    _G.TPS_LIMIT_TPS = nil
    _G.TPS_WINDOW    = 20                       -- 聚合窗口(秒);与 TTFT 一致,低尾 P20 样本少时更需要大窗口
    -- P20 直方图桶上界(tokens/sec):落在哪个桶 incr 哪个;P20 取累计越过 20% 的桶上界(低尾代表值)。
    -- 升序排列;超出末桶进 overflow 桶(代表值取末桶×2)。按实测解码速率分布调整。
    _G.TPS_BUCKETS   = {5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200, 300}

    -- ── 自适应并发(AIMD)全局默认 ──
    -- ADAPTIVE_CC_DEFAULT=true:凡路由配了 tps_limit_tps 且未显式写 adaptive_cc → 默认走**自适应并发**
    -- (而非 TPS 硬熔断)。要退回硬熔断在该路由 factory 显式写 adaptive_cc=false。没配 tps_limit_tps 的
    -- 路由不受影响(无 tps 限流)。改 false 则全局默认回到硬熔断。
    _G.ADAPTIVE_CC_DEFAULT = true
    -- 乘子(每路由可在 factory 用 adaptive_cc_dec / adaptive_cc_inc 覆盖):减快增慢(激进保护、保守恢复):
    -- EWMA < 阈值 → 并发上限 ×dec(缩);>= 阈值 **且并发顶到 cc 边缘(有压力)** → ×inc(增)。
    -- 见 do_adaptive_cc_loop + _G.ADAPTIVE_CC_PRESSURE_FRAC。
    _G.ADAPTIVE_CC_DEC = 0.97   -- 减:×0.97 = −3%/步
    _G.ADAPTIVE_CC_INC = 1.02   -- 增:×1.02 = +2%/步(2026-07-20 全局默认从 1.01 上调,推广 b300 实测口径到主集群 kimi-k2.6/glm)
    -- min 缺省比例:不配 adaptive_cc_min 时,下限 = 静态max × 此比例(每路由可用 adaptive_cc_min_frac 覆盖)。
    _G.ADAPTIVE_CC_MIN_FRAC = 0.4
    -- cc 值 TTL(秒):无 EWMA 信号超过此时长 → cc 老化过期 → 回退到 min(慢启动)。每路由可用 adaptive_cc_ttl 覆盖。
    _G.ADAPTIVE_CC_TTL = 300
    -- 爬升压力系数:健康(ewma≥阈值)时,只有当前并发 >= cc × 此系数(顶到 cc 边缘/在造成 429)才 ×inc 爬。
    -- 防"轻流量下 cc 无脑涨到 max、远超实际并发 → 突发一次性放行整波、decode 塌"。
    -- 与 SLACK_FRAC 配合:并发在 [slack,pressure)×cc 之间保持;< slack×cc 则缩(见下)。cc 稳态 ≈ 实际并发/mid
    -- (mid=(pressure+slack)/2;默认 0.9/0.7 → cc 停在 ~1.25× 当前并发)。每路由可用 adaptive_cc_pressure_frac 覆盖。
    _G.ADAPTIVE_CC_PRESSURE_FRAC = 0.9
    -- 空闲缩系数:健康(ewma≥阈值)但并发 < cc×此系数(余量太大)→ cc 也 ×dec 往下跟实际并发。
    -- 补"忙→闲后 cc 卡在旧峰值"的洞:否则细流(ewma 仍健康)时 cc 不降,突发一次放行旧峰值 decode 塌。
    -- 需 < pressure_frac(留 [slack,pressure) 保持带防抖):cc 稳态 ≈ [1/pressure, 1/slack]×实际并发。
    -- 缩仍受 min 兜底(clamp math.max(mincc, ..))。每路由可用 adaptive_cc_slack_frac 覆盖。
    _G.ADAPTIVE_CC_SLACK_FRAC = 0.7
    -- 绝对头寸(slots):相对系数 0.9/0.7 在**小并发**下带宽太窄(cc=6 → [4.2,5.4],差 1 个请求就翻状态,
    -- 且 cc 封顶=1.25×并发 → 并发只有 5 时 cc 最多 ~6,突发无缓冲),故再加一个绝对头寸兜底:
    -- 目标 cc = max(相对 conc/mid, 绝对 conc+ABS);涨门加"绝对头寸不足(cc-conc<ABS)也涨",
    -- 缩门加"绝对余量够(cc-conc>ABS)才缩"。保证任何并发下 cc 至少比实际并发高 ABS 个,给突发留缓冲。
    -- 每路由可用 adaptive_cc_abs 覆盖。
    _G.ADAPTIVE_CC_ABS = 5

    -- ── sid 来源开关 ──
    -- body.user 来自 OpenAI 标准 `user` 字段。线上观察到大量请求共用同一个 user 值
    -- （upstream-gateway 把 example uid 透传过来），导致单个 peer 被极少数 uid 拉爆，
    -- 18 套里有 8 套几乎闲置。开启此开关后，body.user 不再作为 sid 来源，
    -- 这部分请求会 fallthrough 到 least_conn，从而打散到所有 peer。
    -- 不影响 header / metadata.session_id / metadata.user_id.session_id 等其他 sid 来源。
    _G.DISABLE_BODY_USER_AFFINITY = true

    -- ── session 亲和性(会话粘性 hash 路由)总开关 ──
    -- false(默认,2026-07-08 改)= 忽略所有 sid,全部请求走 least_conn 打散(关掉会话粘性)。
    -- true = 提取到 sid 就走 rendezvous 一致性哈希(同会话粘同一 peer,利于 vllm prefix cache)。
    -- 与 DISABLE_BODY_USER_AFFINITY 的区别:后者只砍 body.user 一个 sid 来源;此开关关掉全部粘性。
    -- 每路由可用 opts.session_affinity_enabled = true/false 覆盖(在各自 session_route_<name>.conf 的
    -- register_route factory 里设);opts 不设(nil)则回落此全局值。config 级,reload 生效。
    _G.SESSION_AFFINITY_ENABLED = false

    -- ── cch-strip 开关（默认开，2026-07-22 改：与线上 6 主力路由热切实态对齐，防 full restart 回落关掉）──
    -- 切换通过 /_cch_strip_toggle?on=0|1 热切，写入 ngx.shared.cch_ctl，跨 reload 持久；
    -- 只有 nginx master 重启（不是 reload）才会回 DEFAULT。
    _G.CCH_STRIP_DEFAULT_ENABLED = true

    -- ── 规则化请求拒绝(reject_rules)全局默认 ──
    -- 按请求内容匹配规则 → 拒绝并返回可配 status。规则本体在各 session_route_<model>.conf 的 factory
    -- 配 reject_rules = { {name,field,op,value[,status][,message]} 或 {name,all/any={...}} , ... }(nil=不启用)。
    -- 实现见 lua/reject_rules.lua。以下两项每路由可用 opts.reject_rules_status / reject_rules_default_enabled 覆盖。
    _G.REJECT_RULES_DEFAULT_STATUS  = 429    -- 规则拒绝默认 status(每规则可再用 rule.status 覆盖)
    -- ⚠️ 安全默认【关】:配了 reject_rules 的路由默认**不生效**(避免误配置直接拒真实流量)。
    -- 开启二选一:① factory 里显式 reject_rules_default_enabled = true(config 级,reload 生效);
    -- ② 运行时 /_reject_rules_toggle?on=1(写 cch_ctl,免 reload,跨 reload 持久)。
    _G.REJECT_RULES_DEFAULT_ENABLED = false
}
# ── 固定 admin/health server(baked,不随动态路由)──
# 一起 nginx master 就在,给 k8s 探针(readiness/liveness)+ ha-gate 探活用稳定端口 8090;
# 无鉴权、无路由逻辑,与业务路由端口(各模型 listen)解耦。monitor 仍探各模型 listen 端口,不碰这个。
server {
    listen 8090;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# dispatch 只在**转发失败/异常**时记一行(未知路由 key → 502、4xx 等),成功请求不记(真日志在
# per-model 的 session_log)。既补上"未知 key 502 无处可查"的可观测盲区,又不与 session_log 双写。
map $status $dispatch_log {
    ~^[45]  1;    # 4xx/5xx 才记(含未知路由 socket 不存在的 502)
    default 0;
}

# ── 路径路由 dispatch(baked)—— 单外部口 8080,按 /<key>/ 首段分发到各 per-model server 的 unix socket ──
# per-model server 只需把 listen 从 `listen <port>;` 改/加成 `listen unix:sock/<key>.sock;`(其余全不动:
#   server_name/set $route/register/include router_locations)。socket 名 = 外部路径 key(= llm-gateway /llm/<key>/,
#   可与内部 $route 不同)。dispatch 从路径首段派生 socket,零映射表;Host 原样透传;未知 key → socket 不存在 → 502。
# sock 目录 = <nginx prefix>/sock(绝对路径,listen unix: 不认相对);镜像 Dockerfile `mkdir <prefix>/sock`
# (= /usr/local/openresty/nginx/sock,非 tmpfs、随镜像层持久)。隔离 harness 里 sed 成自己的 prefix/sock。
server {
    listen 8080;
    server_name _;
    # dispatch 在 per-model【之前】,不设则走 nginx 默认 1m。这里是**天花板**,不承担业务限制:
    # 各 per-model server 用自己的 client_max_body_size 表达各自的上限(LLM 10m、视频生成 64m),
    # 一条路径取最严的那个。
    #
    # 为什么从 10m 抬到 100m:视频生成(MiniMax H3)的 I2V 允许 base64 传图,单请求可到 64MB。
    # dispatch 的限制先于 per-model 生效,压在 10m 时那类路由无论自己配多大都会在入口 413。
    # 业务限制随之【下移到 per-model】:router_locations.inc 由 50m 收到 10m,LLM 的实际上限不变
    # (仍是 10m,与下游 CART 的 max_body_size 默认值对齐;要再放宽须同时调 CART)。
    #
    # 代价:超过 per-model 上限的请求现在会先在这里被缓冲(> client_body_buffer_size 就落临时文件)
    # 再到 per-model 层 413,而不是在最外层立即拒。原注释担心的另一半「reqtransform 阻塞读回整个
    # 文件卡 worker」不会发生 —— nginx 在请求头阶段按 Content-Length 就拒了,lua 根本读不到 body。
    client_body_buffer_size 4m;
    client_max_body_size 100m;
    # 信任本机上游(llm-gateway 443 反代 → 127.0.0.1:8080)透传的 X-Real-IP,还原真实客户端 IP,再由下方
    # proxy_set_header X-Real-IP $remote_addr 传给 per-model → admin(_*)端点按真实客户端 IP 判 allow 127.0.0.1
    # (外部→deny)。不加:$remote_addr=127.0.0.1(llm-gateway 反代跳)→ dispatch 把真实 IP 覆盖成 127.0.0.1,
    # admin 端点对外仍可达(2026-07-31 ts31 双反代实测踩中)。仅信任 127.0.0.1(同机 llm-gateway);外部直连
    # 8080 的客户端 $remote_addr 非 127 → 不被信任、无法伪造。k8s 若前置独立 ingress,需按其 CIDR 追加。
    set_real_ip_from 127.0.0.1;
    real_ip_header    X-Real-IP;
    # 只记 4xx/5xx 到独立 dispatch.log(未知路由 502 可见);成功请求不记(真日志在 per-model session_log,
    # 不双写/不混排 access.log)。见文件上方 map $dispatch_log。
    access_log logs/dispatch.log combined if=$dispatch_log;
    # sockdir 运行时从 nginx prefix 派生(= <prefix>/sock/),与 per-model `listen unix:<prefix>/sock/<route>.sock` 对齐。
    # dispatch 侧不再硬编码 socket 目录 —— 唯一锚点 = openresty prefix 约定(实测 ngx.config.prefix() 带尾斜杠,已兼容)。
    set_by_lua_block $sockdir { local p = ngx.config.prefix(); if p:sub(-1) ~= "/" then p = p .. "/" end; return p .. "sock/" }
    # 注册 routed_* 变量:http log_format session_log 引用它们,而它们平时只在 per-model server 里 set。
    # 没有任何路由(conf.d/routes/ 空,如初次部署/滚动瞬间)时,这里保证变量已知 → openresty 不再
    # 因 "unknown routed_session_id variable" 崩(此前空 routes/ 会 crash)。dispatch 只转发,值恒 "-"。
    set $routed_session_id "-";
    set $routed_source "-";
    set $routed_mode "-";
    set $routed_peer "-";
    location ~ ^/(?<rkey>[a-z0-9._-]+)(?<rest>/.*)$ {
        # $is_args$args 必须带:变量式 proxy_pass 不会自动附加查询串,漏了则 /_tps_limit?tps=..&model=.. 等
        # 带 query 的端点(在线调参 / _route_debug?sid= 等)参数全丢(实测确认)。
        proxy_pass http://unix:$sockdir$rkey.sock:$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;             # SSE 响应流式(不缓冲响应)
        # ⚠️ 显式写死 on(默认即 on):变量式 unix socket proxy 下若为 off 会挂起 POST 请求体转发
        #    (实测 8080/<route> hang;直连 socket 正常)。写死 = 免疫 http 层 off 覆盖 + 防误改。LLM 请求体小,缓冲无妨。
        proxy_request_buffering on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# —— 本文件到此为「框架基座」(baked into image);具体路由(K2.5/GLM/... 的 server + peers)
#    在各自 session_route_<model>.conf(conf.d/routes/,由 autoconfig 生成挂载)。
