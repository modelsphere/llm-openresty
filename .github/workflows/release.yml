# Build and publish the three images to Docker Hub on a tag, for linux/amd64 and
# linux/arm64.
#
# Tag naming:
#
#   openresty/v0.2.0  -> 4pdosc/llm-openresty:0.2.0
#   bodylog/v0.2.0    -> 4pdosc/bodylog-listener:0.2.0
#   exporter/v0.2.0   -> 4pdosc/bodylog-exporter:0.2.0
#   0.2.0             -> all three (the older prefix-less form)
#
# The component prefix is stripped from the image tag: a Helm chart's version must
# be valid SemVer, and a prefixed one is rejected outright.
#
# Why separate tags per component: sharing one counter means a change to the
# exporter also publishes identical new versions of the other two, and moves all
# three :latest tags onto builds nobody asked for.
#
# Some ARG defaults in the Dockerfiles target a mirror-backed build environment,
# so the values a GitHub runner needs are passed here as build args:
#
#   GOPROXY  - the default is a regional mirror; a GitHub runner needs the
#              upstream proxy.
#
# The openresty image needs no overrides: its defaults (ubuntu:22.04 plus
# INSTALL_OPENRESTY=1) are already the public path.
#
# Multi-arch: each image is built once per platform on a runner of that
# architecture (ubuntu-latest / ubuntu-24.04-arm), pushed by digest, and a merge job
# then joins the digests into one manifest list under the version tag (and :latest).
# Native runners rather than QEMU because bodylog-listener links go-duckdb's prebuilt
# native library through CGO: emulating that build is slow, and cross-compiling it
# needs a cross toolchain. Every per-platform build is also started and checked on
# its own architecture before anything is pushed (see "Smoke test").
#
# Pull requests that touch the images build all three for both platforms and run the
# smoke tests, but log in to nothing and push nothing.
#
# Charts are NOT published here -- they live in modelsphere/helm-charts and
# are released by that repository's own chart-releaser workflow.
name: release

on:
  push:
    tags:
      - 'openresty/v[0-9]*'
      - 'bodylog/v[0-9]*'
      - 'exporter/v[0-9]*'
      - '[0-9]*'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.bodylog'
      - 'Dockerfile.bodylog.dockerignore'
      - '.dockerignore'
      - 'nginx.conf'
      - 'session_base.conf'
      - 'router_locations.inc'
      - 'lua/**'
      - 'vendor/**'
      - 'bodylog-listener-go/**'
      - 'bodylog-exporter-go/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push (e.g. 0.2.0)'
        required: true
      components:
        description: 'Which images: all, openresty, bodylog, exporter'
        default: all

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version:   ${{ steps.v.outputs.version }}
      latest:    ${{ steps.v.outputs.latest }}
      openresty: ${{ steps.v.outputs.openresty }}
      bodylog:   ${{ steps.v.outputs.bodylog }}
      exporter:  ${{ steps.v.outputs.exporter }}
      push:      ${{ steps.v.outputs.push }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          PUSH=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Build and check everything, publish nothing.
            REF="pr-${{ github.event.number }}"; VERSION="$REF"
            O=true; B=true; E=true; PUSH=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.components }}"
            VERSION="${{ inputs.version }}"
            case "$REF" in
              all)       O=true; B=true; E=true ;;
              openresty) O=true; B=false; E=false ;;
              bodylog)   O=false; B=true; E=false ;;
              exporter)  O=false; B=false; E=true ;;
              *) echo "unknown components: $REF" >&2; exit 1 ;;
            esac
          else
            REF="${{ github.ref_name }}"
            # Strip the component prefix. Only one of these can match; the others
            # are no-ops, and a prefix-less tag passes through untouched.
            VERSION="${REF#openresty/v}"; VERSION="${VERSION#bodylog/v}"; VERSION="${VERSION#exporter/v}"
            case "$REF" in
              openresty/v*) O=true;  B=false; E=false ;;
              bodylog/v*)   O=false; B=true;  E=false ;;
              exporter/v*)  O=false; B=false; E=true  ;;
              */*)          echo "unrecognised tag: $REF" >&2; exit 1 ;;
              *)            O=true;  B=true;  E=true  ;;
            esac
          fi

          # A version must not still contain a slash, or it would produce an
          # image tag Docker rejects -- fail loudly rather than pushing junk.
          case "$VERSION" in
            */*|'') echo "bad version derived from '$REF': '$VERSION'" >&2; exit 1 ;;
          esac

          # Pre-release versions (a SemVer "-" suffix, e.g. 0.2.0-rc1) do NOT move
          # :latest. A release candidate exists to be tested deliberately; it should
          # never become what you get by not specifying a version.
          case "$VERSION" in *-*) LATEST=false ;; *) LATEST=true ;; esac

          {
            echo "version=$VERSION"
            echo "latest=$LATEST"
            echo "openresty=$O"
            echo "bodylog=$B"
            echo "exporter=$E"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

          echo "ref=$REF -> version=$VERSION latest=$LATEST push=$PUSH (openresty=$O bodylog=$B exporter=$E)"

  # Tests gate the push: nothing is published unless they pass.
  #
  # The job always runs rather than carrying an `if:`. A job whose `needs` was
  # skipped is itself skipped, so gating this one on "is bodylog in this tag"
  # would stop an openresty/ or exporter/ tag from building anything at all.
  # Instead it runs, checks what the tag selected, and does nothing when bodylog
  # is not part of it -- the same shape the image job uses below.
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Does this ref build bodylog?
        id: gate
        run: echo "run=${{ needs.setup.outputs.bodylog }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.24'
          cache-dependency-path: bodylog-listener-go/go.sum

      # CGO is required -- go-duckdb embeds libduckdb.a (cxx11 ABI).
      - name: go test
        if: steps.gate.outputs.run == 'true'
        working-directory: bodylog-listener-go
        env:
          CGO_ENABLED: 1
        run: go test ./...

  # One job per component and platform, each on a runner of that architecture.
  image:
    needs: [setup, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        component: [openresty, bodylog, exporter]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - component: openresty
            image: 4pdosc/llm-openresty
            context: .
            dockerfile: Dockerfile
            build_args: ''
          - component: bodylog
            image: 4pdosc/bodylog-listener
            context: .
            dockerfile: Dockerfile.bodylog
            build_args: |
              GOPROXY=https://proxy.golang.org,direct
          - component: exporter
            image: 4pdosc/bodylog-exporter
            context: bodylog-exporter-go
            dockerfile: bodylog-exporter-go/Dockerfile
            build_args: |
              GOPROXY=https://proxy.golang.org,direct
    steps:
      - name: Should this component build?
        id: gate
        run: echo "run=${{ needs.setup.outputs[matrix.component] }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      # Built into the local daemon first so it can be run on this architecture
      # before anything is pushed. The push below reuses this build's cache.
      - name: Build (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          sbom: false
          tags: smoke/${{ matrix.component }}:${{ matrix.arch }}

      # Start the image on its own architecture and check it actually works --
      # a binary built for the wrong architecture, or a native library that does
      # not load, fails here rather than on a cluster.
      - name: Smoke test (${{ matrix.platform }})
        if: steps.gate.outputs.run == 'true'
        env:
          IMG: smoke/${{ matrix.component }}:${{ matrix.arch }}
          COMPONENT: ${{ matrix.component }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          got=$(docker image inspect --format '{{.Architecture}}' "$IMG")
          [ "$got" = "$WANT_ARCH" ] || { echo "image architecture is $got, want $WANT_ARCH" >&2; exit 1; }
          # The image config's architecture is only a label. Check the main binary's ELF
          # header too: a build can hard-code GOARCH and still produce an "arm64" image.
          case "$COMPONENT" in
            openresty) bin=/usr/local/openresty/nginx/sbin/nginx ;;
            bodylog)   bin=/usr/local/bin/bodylog-listener ;;
            exporter)  bin=/usr/local/bin/bodylog-exporter ;;
          esac
          case "$WANT_ARCH" in amd64) elf='x86-64' ;; arm64) elf='ARM aarch64' ;; esac
          cid=$(docker create "$IMG")
          docker cp -L "$cid:$bin" ./smoke-bin
          docker rm "$cid" >/dev/null
          desc=$(file -b ./smoke-bin)
          echo "$bin: $desc"
          case "$desc" in *"$elf"*) ;; *) echo "$bin is not a $WANT_ARCH binary" >&2; exit 1 ;; esac
          case "$COMPONENT" in
            openresty)
              docker run --rm "$IMG" /usr/local/openresty/bin/openresty -V
              ;;
            bodylog)
              # go-duckdb is native code: the listener must report duckdb ready.
              docker run -d --name smoke "$IMG"
              for i in $(seq 1 30); do docker logs smoke 2>&1 | grep -q 'listening on' && break; sleep 1; done
              docker logs smoke 2>&1
              docker logs smoke 2>&1 | grep -q 'duckdb ready' || { echo "duckdb did not load" >&2; exit 1; }
              docker logs smoke 2>&1 | grep -q 'listening on' || { echo "listener did not start" >&2; exit 1; }
              docker rm -f smoke
              ;;
            exporter)
              docker run -d --name smoke -p 9110:9110 "$IMG"
              ok=
              for i in $(seq 1 30); do
                if [ "$(curl -s -m 2 http://127.0.0.1:9110/healthz || true)" = "OK" ]; then ok=1; break; fi
                sleep 1
              done
              docker logs smoke 2>&1
              docker rm -f smoke
              [ -n "$ok" ] || { echo "exporter /healthz did not answer OK" >&2; exit 1; }
              ;;
          esac

      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true' && needs.setup.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by digest
        id: push
        if: steps.gate.outputs.run == 'true' && needs.setup.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ matrix.platform }}
          # No attestations: some container runtimes stall pulling the attestation
          # variant. The merge job below joins the plain per-platform manifests.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: steps.gate.outputs.run == 'true' && needs.setup.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && needs.setup.outputs.push == 'true'
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-platform digests into one manifest list per component and tag it.
  merge:
    needs: [setup, image]
    if: needs.setup.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: openresty
            image: 4pdosc/llm-openresty
          - component: bodylog
            image: 4pdosc/bodylog-listener
          - component: exporter
            image: 4pdosc/bodylog-exporter
    steps:
      - name: Should this component publish?
        id: gate
        run: echo "run=${{ needs.setup.outputs[matrix.component] }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the manifest list
        if: steps.gate.outputs.run == 'true'
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.setup.outputs.version }}
          LATEST: ${{ needs.setup.outputs.latest }}
        run: |
          set -euo pipefail
          n=$(ls | wc -l)
          [ "$n" -eq 2 ] || { echo "expected 2 platform digests, got $n" >&2; exit 1; }
          tags=(-t "$IMAGE:$VERSION")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
