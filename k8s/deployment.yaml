# openresty 全模型 session-affinity 路由 —— 路径路由(单口 8080 dispatch)最小 standalone 参考清单。
# 生产/动态路由 + 主备 HA + reload 热更请用 Helm chart(helm/openresty),这里只演示 pod 形态。
#
# 路径路由:外部只打一个口 8080,dispatch 按路径首段 /<route>/ 派生到 per-model server 的 unix socket。
#   per-model 路由 conf(session_route_<route>.conf)不烤镜像 —— 挂 ConfigMap 到 conf.d/routes/
#   (下面给了个空 ConfigMap 占位;自己填,或用 Helm chart + autoconfig 动态写入)。8090 = admin/health(baked,/healthz)。
#
# 优雅停机三件套(详见 k8s/README.md「优雅停机」):
#   ① 镜像 STOPSIGNAL SIGQUIT       → k8s 停 pod 走 nginx 优雅排空(等在途长流跑完),不砍
#   ② terminationGracePeriodSeconds → 唯一硬切刀,按最长流式响应设(见下)
#   ③ preStop sleep                 → 等 Service 端点摘除传播完再关 listener,排空期不进新连接
---
apiVersion: v1
kind: Namespace
metadata: { name: openresty }
---
# per-model 路由 conf 挂到 conf.d/routes/。空 = 只有框架起来(dispatch 打任何 /<route>/ 都 502,直到填入路由)。
# 每个 key = 一个 session_route_<route>.conf;自己维护,或用 Helm chart + autoconfig 动态写入。
apiVersion: v1
kind: ConfigMap
metadata: { name: openresty-routes, namespace: openresty }
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openresty-router
  namespace: openresty
  labels: { app: openresty-router }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # 先起新 pod ready 再排空老 pod,过程零不可用
  selector:
    matchLabels: { app: openresty-router }
  template:
    metadata:
      labels: { app: openresty-router }
    spec:
      # ★ 唯一硬切刀:到点 SIGKILL 强砍在途流。openresty proxy timeout 到 3600s、LLM 64K 输出可能上千秒
      #   → 3600 = 对齐 proxy_read_timeout(排空到最长流生命周期,基本不切超长流;代价:老 pod Terminating 可能很久)。
      terminationGracePeriodSeconds: 3600
      containers:
      - name: openresty
        image: registry.example.com/llm/llm-openresty:0.3.4-dispatch   # 路径路由(8080 dispatch)镜像
        imagePullPolicy: IfNotPresent
        # 镜像已 STOPSIGNAL SIGQUIT → 优雅排空由它触发;preStop 只负责「解端点摘除竞态」
        lifecycle:
          preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } }
        ports:
        - { name: dispatch, containerPort: 8080 }   # 外部入口:8080/<route>/v1/…
        - { name: health,   containerPort: 8090 }   # admin/health(baked,/healthz)
        env:
        # bodylog 异步落盘 listener 地址(镜像已把 nginx.conf 改成 env 透传);留空 = 不发,logger-socket 连不上会 buffer/drop、非阻塞
        - { name: BODYLOG_LISTENER_HOST, value: "" }   # 例:bodylog-listener.openresty.svc.cluster.local
        - { name: BODYLOG_LISTENER_PORT, value: "9999" }
        volumeMounts:
        - { name: routes, mountPath: /usr/local/openresty/nginx/conf/conf.d/routes }   # per-model 路由 conf(整卷挂)
        - { name: sock,   mountPath: /usr/local/openresty/nginx/sock }                 # dispatch ↔ per-model 的 unix socket
        readinessProbe:                                # 打固定 admin 口 /healthz(不随动态路由端口变);未就绪只摘端点、不重启
          httpGet: { path: /healthz, port: 8090 }
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:                                 # openresty 秒级启动,可放 liveness
          httpGet: { path: /healthz, port: 8090 }
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: { cpu: "2",  memory: 512Mi }
          limits:   { cpu: "8",  memory: 2Gi }         # worker_processes=20;CPU 按实际压测调
      volumes:
      - name: routes
        configMap: { name: openresty-routes }
      - name: sock
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openresty-router
  namespace: openresty
  labels: { app: openresty-router }
spec:
  type: ClusterIP
  selector: { app: openresty-router }
  ports:
  - { name: dispatch, port: 8080, targetPort: 8080 }   # 外部入口(客户端/llm-gateway 打 8080/<route>/v1/…)
  - { name: health,   port: 8090, targetPort: 8090 }   # 探针 / 调试
