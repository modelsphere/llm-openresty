{{- if and .Values.exporter.enabled .Values.exporter.routeDiscovery.enabled }}
# exporter 动态发现 route:pod 的 SA 需要 list/watch ModelRoute CR(全集群)。
# 不给这个权限,exporter 列 modelroutes 会 403 → poll 不到任何 route。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bodylog.fullname" . }}-modelroute-reader
  labels: {{- include "bodylog.labels" . | nindent 4 }}
rules:
  - apiGroups: [ "{{ .Values.exporter.routeDiscovery.apiGroup }}" ]
    resources: [ "{{ .Values.exporter.routeDiscovery.plural }}" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bodylog.fullname" . }}-modelroute-reader
  labels: {{- include "bodylog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bodylog.fullname" . }}-modelroute-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "bodylog.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
