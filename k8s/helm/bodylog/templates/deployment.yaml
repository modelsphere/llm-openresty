{{- if and .Values.persistence.hostPath (empty .Values.nodeSelector) }}
{{- fail "\n[bodylog] persistence.hostPath 已设但 nodeSelector 为空:hostPath 用 DirectoryOrCreate,pod 若调度到别的 node 会新建空目录(看似历史数据丢失)。必须配 nodeSelector 把 pod 钉到数据盘所在 node,例如:--set nodeSelector.\"kubernetes\\.io/hostname\"=<node>" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy }}   # Recreate:单实例独占 RWO PVC,不能两 pod 并存
  selector:
    matchLabels: {{- include "bodylog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bodylog.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # 显式 default(而非省略):从带 exporter sidecar 的旧版升级时,旧版设过
      # serviceAccountName: <fullname> 并建了同名 SA。若这里【省略】此字段,helm 3-way merge 会
      # 【保留】live 上旧的 serviceAccountName,同时删掉那个 SA(rbac.yaml 已移除)→ 新 pod
      # FailedCreate(serviceaccount not found)、rollout 卡住。显式 default 让 helm 明确覆盖旧引用。
      # (listener 不调 k8s API,default SA 足够。)
      serviceAccountName: default
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bodylog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: BODYLOG_HOST,      value: "0.0.0.0" }
            - { name: BODYLOG_PORT,      value: "{{ .Values.ports.frame }}" }
            - { name: BODYLOG_HTTP_HOST, value: "0.0.0.0" }
            - { name: BODYLOG_HTTP_PORT, value: "{{ .Values.ports.http }}" }
            - { name: BODYLOG_DIR,       value: "{{ .Values.dataDir }}" }
            - { name: TZ,                value: "{{ .Values.timezone }}" }   # listener 按 time.Local 命名 <date>.jsonl,必须与 exporter DATE_TZ 一致
            - { name: BODYLOG_KEEP_DAYS,         value: "{{ .Values.retention.keepDays }}" }
            - { name: BODYLOG_DETAILS_KEEP_DAYS, value: "{{ .Values.retention.detailsKeepDays }}" }
            - name: BODYLOG_HTTP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "bodylog.secretName" . }}, key: BODYLOG_HTTP_TOKEN }
          ports:
            - { name: frame, containerPort: {{ .Values.ports.frame }} }   # openresty 帧接入(TCP)
            - { name: http,  containerPort: {{ .Values.ports.http }} }    # /summary /metrics /healthz
          {{- if .Values.probes.enabled }}
          startupProbe:                    # 起来前不判 live/ready(慢启动预算)
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:                  # /healthz 始终开放(不鉴权),就绪即可被 Service 路由
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: {{ .Values.dataDir }} }
      volumes:
        - name: data
        {{- if .Values.persistence.hostPath }}
          hostPath: { path: {{ .Values.persistence.hostPath | quote }}, type: DirectoryOrCreate }  # 复用宿主机裸盘(须配 nodeSelector 钉 node)
        {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "bodylog.pvcName" . }} }
        {{- else }}
          emptyDir: {}          # 非持久:Pod 重启丢历史 bodylog(仅测试)
        {{- end }}
