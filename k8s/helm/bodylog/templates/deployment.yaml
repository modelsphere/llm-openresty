{{- if and .Values.persistence.hostPath (empty .Values.nodeSelector) }}
{{- fail "\n[bodylog] persistence.hostPath 已设但 nodeSelector 为空:hostPath 用 DirectoryOrCreate,pod 若调度到别的 node 会新建空目录(看似历史数据丢失)。必须配 nodeSelector 把 pod 钉到数据盘所在 node,例如:--set nodeSelector.\"kubernetes\\.io/hostname\"=<node>" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy }}   # Recreate:单实例独占 RWO PVC,不能两 pod 并存
  selector:
    matchLabels: {{- include "bodylog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bodylog.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.exporter.enabled }}
      serviceAccountName: {{ include "bodylog.fullname" . }}   # list modelroutes + endpointslices(route 富化 & 动态发现用)
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bodylog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: BODYLOG_HOST,      value: "0.0.0.0" }
            - { name: BODYLOG_PORT,      value: "{{ .Values.ports.frame }}" }
            - { name: BODYLOG_HTTP_HOST, value: "0.0.0.0" }
            - { name: BODYLOG_HTTP_PORT, value: "{{ .Values.ports.http }}" }
            - { name: BODYLOG_DIR,       value: "{{ .Values.dataDir }}" }
            - { name: BODYLOG_KEEP_DAYS,         value: "{{ .Values.retention.keepDays }}" }
            - { name: BODYLOG_DETAILS_KEEP_DAYS, value: "{{ .Values.retention.detailsKeepDays }}" }
            - name: BODYLOG_HTTP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "bodylog.secretName" . }}, key: BODYLOG_HTTP_TOKEN }
          ports:
            - { name: frame, containerPort: {{ .Values.ports.frame }} }   # openresty 帧接入(TCP)
            - { name: http,  containerPort: {{ .Values.ports.http }} }    # /summary /metrics /healthz
          {{- if .Values.probes.enabled }}
          startupProbe:                    # 起来前不判 live/ready(慢启动预算)
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:                  # /healthz 始终开放(不鉴权),就绪即可被 Service 路由
            httpGet: { path: /healthz, port: {{ .Values.ports.http }} }
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: {{ .Values.dataDir }} }
        {{- if .Values.exporter.enabled }}
        - name: exporter          # sidecar:明细 jsonl → Prometheus;可选 poll 集群内 openresty 控制面态
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          env:
            - { name: BODYLOG_DETAILS_DIR, value: "{{ .Values.dataDir }}/metrics/details" }
            - { name: EXPORTER_LISTEN,     value: "0.0.0.0:{{ .Values.exporter.port }}" }
            - { name: CHECKPOINT_PATH,     value: "/ckpt/checkpoint.json" }
            - { name: DATE_TZ,             value: "{{ .Values.exporter.dateTz }}" }
            # 跨天 jsonl→parquet 轮转的缺口补读(同 pod 的 bodylog http 口)
            - { name: BODYLOG_URL,         value: "http://127.0.0.1:{{ .Values.ports.http }}" }
            - name: BODYLOG_HTTP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "bodylog.secretName" . }}, key: BODYLOG_HTTP_TOKEN }
            {{- if .Values.exporter.openrestyPoll.url }}
            - { name: OPENRESTY_POLL_URL,         value: "{{ .Values.exporter.openrestyPoll.url }}" }
            - { name: OPENRESTY_POLL_INTERVAL_MS, value: "{{ .Values.exporter.openrestyPoll.intervalMs }}" }
            {{- if .Values.exporter.openrestyPoll.routes }}
            - { name: OPENRESTY_POLL_ROUTES,      value: "{{ join "," .Values.exporter.openrestyPoll.routes }}" }   # 静态覆盖
            {{- else if .Values.exporter.routeDiscovery.enabled }}
            # 动态发现:列 ModelRoute CR(不设 OPENRESTY_POLL_ROUTES → exporter 走 k8s 发现)
            - { name: MODELROUTE_GROUP,                value: "{{ .Values.exporter.routeDiscovery.apiGroup }}" }
            - { name: MODELROUTE_VERSION,              value: "{{ .Values.exporter.routeDiscovery.version }}" }
            - { name: MODELROUTE_PLURAL,               value: "{{ .Values.exporter.routeDiscovery.plural }}" }
            - { name: ROUTE_DISCOVERY_INTERVAL_SECONDS, value: "{{ .Values.exporter.routeDiscovery.intervalSeconds }}" }
            - { name: OPENRESTY_SERVICE,               value: "{{ .Values.exporter.routeDiscovery.openrestyService }}" }
            {{- end }}
            {{- end }}
          ports:
            - { name: exporter, containerPort: {{ .Values.exporter.port }} }
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.exporter.port }} }
            periodSeconds: 15
            failureThreshold: 3
          {{- end }}
          {{- with .Values.exporter.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: {{ .Values.dataDir }}, readOnly: true }  # 只读 tail 明细
            - { name: exporter-ckpt, mountPath: /ckpt }                          # offset checkpoint(emptyDir)
        {{- end }}
      volumes:
        {{- if .Values.exporter.enabled }}
        - name: exporter-ckpt
          emptyDir: {}          # checkpoint:容器重启续读;pod 重调度丢失 → 重读当天文件(counter 天然幂等)
        {{- end }}
        - name: data
        {{- if .Values.persistence.hostPath }}
          hostPath: { path: {{ .Values.persistence.hostPath | quote }}, type: DirectoryOrCreate }  # 复用宿主机裸盘(须配 nodeSelector 钉 node)
        {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "bodylog.pvcName" . }} }
        {{- else }}
          emptyDir: {}          # 非持久:Pod 重启丢历史 bodylog(仅测试)
        {{- end }}
