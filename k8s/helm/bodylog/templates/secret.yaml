{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
type: Opaque
stringData:
  # /summary /metrics 鉴权 token。⚠️ 必须与 monitor 的 BODYLOG_HTTP_TOKEN 一致,否则 monitor 拉 401 断 TPM。
  # 空 = 不鉴权(向后兼容,仅测试)。生产 --set-string secret.token=<权威源 openresty/bodylog_http_token>。
  BODYLOG_HTTP_TOKEN: {{ .Values.secret.token | quote }}
{{- end }}
