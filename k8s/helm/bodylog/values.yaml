image:
  repository: registry.example.com/llm/bodylog-listener
  tag: ""                       # 缺省用 Chart.appVersion
  pullPolicy: IfNotPresent

# 单实例:有状态(独占 PVC)+ 聚合全量帧,不能多副本。Recreate:滚更时先停旧再起新(独占 PVC)。
replicas: 1

# 端口:frame=openresty 帧接入(TCP);http=/summary /metrics /healthz(monitor 拉 + 探针)。
ports:
  frame: 9999
  http: 9998

# 落盘目录(挂 PVC)。按天分目录、按小时切文件,跨日 tar.gz 归档。
dataDir: /data/bodylog

# 时区:listener 按 time.Local 命名 <date>.jsonl、exporter 按 DATE_TZ tail 同名文件 —— 二者【必须一致】,
# 否则 exporter 去 tail 不存在的文件、读不到数据(容器默认 UTC,而生产按北京落盘 → 必须显式设)。
# 同时注入两个容器的 TZ env;exporter DATE_TZ 缺省跟随本值。
timezone: "Asia/Shanghai"

# 持久化:落盘卷。生产必开(关了 Pod 重启丢历史 bodylog)。
persistence:
  enabled: true
  # hostPath:非空 → data 卷用【宿主机目录】(复用某 node 的裸盘,如已有 bodylog 数据的机器)。
  #   置非空时:不建 PVC、忽略 storageClassName/size/existingClaim;
  #   ⚠️ 必须配 nodeSelector 把 pod 钉到有这块盘的那台 node(否则调度到别的 node 会指到空目录);
  #   ⚠️ 单写者:接管前必须先停掉那台机器上原来的 bodylog 进程,不能两个 listener 同写一目录。
  hostPath: ""
  storageClassName: ""          # 空=用集群默认 SC(如 ceph-block)
  accessMode: ReadWriteOnce
  size: 2Ti                    # 生产量级:ts34 90天≈2.3T,配合 keepDays=60 稳进(ceph-block 3.3TiB 池)
  # existingClaim: ""           # 复用已有 PVC 时填

# 保留天数(bodylog 按【时间】清理,不按大小)。历史 .tar.gz 归档留 keepDays 天;metrics 明细 parquet 留 detailsKeepDays 天。
# ts34 生产实测 ~25G/天压缩,90 天≈2.3T > 2Ti → keepDays 压到 60(≈1.5T)稳进 2Ti 盘。
retention:
  keepDays: 60          # BODYLOG_KEEP_DAYS(默认 90)
  detailsKeepDays: 365  # BODYLOG_DETAILS_KEEP_DAYS(默认 365)

# /summary /metrics 鉴权 token(BODYLOG_HTTP_TOKEN)。**必须与 monitor 侧一致**,否则 monitor 拉 401 断采。
# secret.create=true 时用下面 token 建 Secret;false 时引用 existingSecret(键 BODYLOG_HTTP_TOKEN)。
# 空 token = 不鉴权(向后兼容,仅测试用)。
secret:
  create: true
  existingSecret: ""
  token: ""                     # 部署时 --set-string secret.token=<真值>;权威源 openresty/bodylog_http_token

# bodylog-exporter sidecar:tail 明细 jsonl → Prometheus 指标(流量侧),并可选 poll 集群内 openresty
# 的实时路由/限流状态(控制面侧)。与 bodylog 同 pod、共享 data 卷(只读读 details)。
exporter:
  enabled: true
  image:
    repository: registry.example.com/llm/bodylog-exporter
    tag: ""                     # 缺省用 Chart.appVersion
    pullPolicy: IfNotPresent
  port: 9110                     # /metrics 抓取口
  dateTz: ""                     # 明细按天命名时区;空=跟随顶层 timezone(须与 listener TZ 一致)。一般不用单独设
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }
  # openresty-poll:poll 集群内 openresty 的 /<route>/_route_state|_tps_status|_ttft_status|_429_status。
  # url 空 = 只做 tail、不 poll。route 集合默认【动态发现】(见 routeDiscovery);routes 为静态逃生口。
  openrestyPoll:
    url: "http://openresty:8080"   # 集群内 openresty Service(同 ns 短名;跨 ns 用 openresty.<ns>.svc:8080)
    routes: []                     # 静态覆盖(非空则不走动态发现);留空=用 routeDiscovery 动态列 ModelRoute
    intervalMs: 15000
  # 动态发现 route:list ModelRoute CR(routing.gpucluster.io)→ 当前 k8s 里所有 route,增删自动跟随。
  # 需 RBAC(rbac.yaml 建 SA+ClusterRole 让 pod 能 list modelroutes)。
  routeDiscovery:
    enabled: true
    apiGroup: routing.gpucluster.io
    version: v1alpha1
    plural: modelroutes
    intervalSeconds: 30
    # 只统计 nginx.service 指向这台 openresty 的 route(多 openresty 时用);空=全要(单 openresty 留空)
    openrestyService: ""
  # ServiceMonitor:让集群内 kube-prometheus-stack 抓 exporter 的 :9110(需 prometheus-operator)。
  serviceMonitor:
    enabled: true
    interval: 30s
    releaseLabel: kube-prometheus-stack   # Prometheus CR 的 serviceMonitorSelector 匹配的 label 值

service:
  type: ClusterIP               # frame 口给集群内 openresty 连;http 口给 monitor 拉。跨集群另配。

resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "2",    memory: "4Gi" }   # duckdb /metrics 查询 + 归档吃内存

probes:
  enabled: true                 # /healthz(9998,始终开放)做 liveness/readiness

# 单实例 + 独占 PVC → Recreate(不能 RollingUpdate,两 pod 抢 RWO 卷)
strategy: Recreate

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
