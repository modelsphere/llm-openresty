image:
  repository: registry.example.com/llm/llm-openresty
  tag: "0.3.5-health"       # per-peer 健康探针(cart→/health,修 /v1/models 缓存骗过探针)
  pullPolicy: IfNotPresent

replicas: 2                # master-standby:2 副本,只有 leader 收流量(见 ha)

adminPort: 8090                # baked 的固定 admin/health 口(session_base.conf 里,/healthz);探针 + ha-gate 用它

# master-standby(主备):ha-gate sidecar 选举,只有持 Lease 的 leader 打 active 标签 → 只有它进 Service。
# openresty 的路由态(active_conns/adaptive-cc/health-timer)是 pod 内共享内存,不能 active-active。
ha:
  enabled: true
  image: registry.example.com/llm/autoconfig-hagate:0.3.22
  port: 8081
  # appTcp 盯固定 admin 口(不随动态路由端口变);nginx 一起 8090 就在 → 探得到才是真活着
  appTcp: "127.0.0.1:8090"

# probes:开关(Helm 约定,非 k8s 语法)——同时开/关 startup+liveness+readiness 三个探针(都打 admin 口 /healthz)
probes:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1              # 驱逐/滚动时至少留 1 个(保住备)

# ── 优雅停机(滚动更新/驱逐时排空在途长流)──────────────────────────────
# nginx 信号反直觉:SIGTERM=快速停机(砍在途)、SIGQUIT=优雅排空。镜像已 STOPSIGNAL=SIGQUIT
# → k8s 停 pod 实际发 SIGQUIT,nginx 停 accept、等在途长流跑完再退。配合下面两项:
# terminationGracePeriodSeconds:唯一硬切刀,到点 SIGKILL 强砍在途流。LLM 64K 输出可能跑上千秒,
#   按「滚更时最长排空多久」设;调大代价 = 老 pod Terminating 更久。0/空 = 用 k8s 默认 30s(不建议,会砍长流)。
#   3600 = 对齐 proxy_read_timeout 3600s(排空到最长流生命周期,基本不切超长流)。
terminationGracePeriodSeconds: 3600
# preStop:pod 进 Terminating 后要几秒才从 Service 端点摘除完(传播到各节点 kube-proxy);
#   先 sleep 住、让摘除传播完再关 nginx listener → 排空期间不再进新连接被拒(消「摘除竞态」)。
#   sleepSeconds: 0 = 不注入 preStop(接受滚更瞬间偶发可重试的连接 reset)。
preStop:
  sleepSeconds: 5

# ── 滚动更新策略 ──────────────────────────────────────────────────────
# maxSurge/maxUnavailable:先起新 pod ready 再排空老 pod → 滚更零不可用(主备下配合 PDB 更稳)。
# 整个 updateStrategy 置空({})= 用 k8s 默认(25%/25%)。
updateStrategy:
  maxSurge: 1
  maxUnavailable: 0

# 路由 ConfigMap(挂到 conf.d/routes/):**chart 创建初值**,autoconfig 更新(等价手动改 CM;
# Helm 3 三方合并:模板不变时 upgrade 不覆盖 autoconfig 加的 key)。没 autoconfig 时手动编辑此 CM 即可。
configMapName: openresty-conf
initialRoutes: {}          # 初始 session_route_<route>.conf(文件名: 内容);默认空(仅框架起,路由由 autoconfig 填)

# reload sidecar:同一个 autoconfig-reload 镜像,watch conf.d/routes 变化 → SIGHUP nginx master。
reload:
  enabled: true
  image: registry.example.com/llm/autoconfig-reload:0.3.22
  process: "nginx: master"

service:
  type: ClusterIP
  ports:               # 路径路由:单外部口 8080(dispatch,按 /<route>/ 分发)+ 8090(health/probe)。
    - { name: dispatch, port: 8080 }   # ← 外部入口:客户端/llm-gateway 打 8080/<route>/v1/…(加模型不用改这里)
    - { name: health,   port: 8090 }

resources:                              # worker_processes=20 的生产 openresty:上限 20c/32Gi
  requests: { cpu: "2",  memory: 2Gi }  # 请求给中档保调度;要 Guaranteed QoS 就把 requests 提到 = limits
  limits:   { cpu: "20", memory: 32Gi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
