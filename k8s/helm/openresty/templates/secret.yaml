{{- if .Values.secret.create }}
# Created by this chart only when secret.create=true (test / single-host). In
# production prefer create=false plus existingSecret=<name of a Secret created
# out of band>, so the keys never reach git or values.yaml.
#
# The entry must be named `keys`: the deployment mounts this Secret as a
# directory, so each entry name becomes a file name and the engine reads
# .../api-keys/keys.
#
# A file rather than an environment variable, because nginx re-reads files on
# `-s reload` but never re-reads `env` declarations -- so keys can be rotated
# with a graceful reload instead of restarting the master and dropping every
# in-flight stream.
#
# Format `key1:owner1,key2:owner2`. An empty value means no authentication --
# the engine logs an error and /_health_status reports
# _meta.api_keys_configured=false.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openresty.fullname" . }}
  labels: {{- include "openresty.labels" . | nindent 4 }}
type: Opaque
stringData:
  keys: {{ .Values.secret.keys | quote }}
{{- end }}
