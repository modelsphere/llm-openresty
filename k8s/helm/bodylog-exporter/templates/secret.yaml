{{- if .Values.secret.create }}
# 仅当 secret.create=true 时本 chart 自建。默认 create=false + existingSecret=bodylog:复用 listener 的
# Secret,token 天然一致。⚠️ token 必须与 listener 的 BODYLOG_HTTP_TOKEN 一致,否则跨天补读 401。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bodylog-exporter.fullname" . }}
  labels: {{- include "bodylog-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  BODYLOG_HTTP_TOKEN: {{ .Values.secret.token | quote }}
{{- end }}
