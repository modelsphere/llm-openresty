# 打 tag 自动 build openresty 镜像并 push 到 harbor
#
# 参考同组 chat-engine 惯例:org 共享 `public-buildx` runner —— docker daemon 已内置 harbor 鉴权,
# CI 里不需要 docker login、也不需要配任何 HARBOR_ 变量,直接 docker build + docker push。
# (已在 feat/openresty-k8s-image 上实测跑通:build FROM harbor openresty-base + push harbor 成功。)
#
# app 镜像 FROM harbor 的 openresty-base(见 Dockerfile / Dockerfile.base),纯 COPY 配置、不装东西,
# 所以 public-buildx runner 够不到 docker.io/外网也能 build。
#
# 触发:仅打 git tag。产物 registry.example.com/llm/llm-openresty:<tag> (+ :latest)。
# 生效前提:本文件要在【被打 tag 的 commit】上(先合进 main),再打 tag。

stages: [build]

variables:
  IMAGE: registry.example.com/llm/llm-openresty
  BODYLOG_IMAGE: registry.example.com/llm/bodylog-listener
  EXPORTER_IMAGE: registry.example.com/llm/bodylog-exporter
  DOCKER_BUILDKIT: "0"             # 出简单 v2 manifest,containerd 直接拉(buildkit attestation manifest-list 拉取会卡)

build:image:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner(在线;docker 已 login harbor)
  rules:
    - if: '$CI_COMMIT_TAG'         # 只在打 tag 时构建;其它 push 不触发
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"

# bodylog-listener 镜像:多阶段 FROM harbor golang:1.24 编 CGO(go-duckdb)→ harbor debian:12-slim。
# 与 openresty 不同,bodylog 要真编译:go module 从阿里云 goproxy 拉(runner 需能到 mirrors.aliyun.com);
# 若 runner 彻底离线,改 `go mod vendor` 入库 + Dockerfile 加 -mod=vendor。base(golang/debian)都在 harbor。
# 实测:gpu-node 上多阶段 build 通过、镜像 duckdb 正常加载。
build:bodylog:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build -f Dockerfile.bodylog -t "$BODYLOG_IMAGE:$CI_COMMIT_TAG" -t "$BODYLOG_IMAGE:latest" .
    - docker push "$BODYLOG_IMAGE:$CI_COMMIT_TAG"
    - docker push "$BODYLOG_IMAGE:latest"

# bodylog-exporter 镜像:纯 Go(CGO off)静态二进制,tail 明细 jsonl → Prometheus。
# 构建上下文 = bodylog-exporter-go/(与 bodylog-listener 隔离,自带 go.mod/go.sum);module 走腾讯 goproxy。
build:exporter:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - docker build -f bodylog-exporter-go/Dockerfile -t "$EXPORTER_IMAGE:$CI_COMMIT_TAG" -t "$EXPORTER_IMAGE:latest" bodylog-exporter-go
    - docker push "$EXPORTER_IMAGE:$CI_COMMIT_TAG"
    - docker push "$EXPORTER_IMAGE:latest"

# helm chart 打包 + push,用 public-buildx runner 内置的 push-chart(org 标准,参考 llm-monitor CI 实测)。
# push-chart 自处理 harbor ChartMuseum 鉴权(cm-push 到 harbor-chart-repo = https://registry.example.com/chartrepo/llm)。
# 本仓有【两个 chart】,分别对应两个镜像,一次 tag 一起推(git tag = 两镜像 tag = 两 chart 版本):
#   - openresty chart:values.yaml image.tag 是【硬钉值】(非 "")→ 连同 chart version/appVersion 一起 sed 成本次 tag
#   - bodylog   chart:values.yaml image.tag=""→回落 appVersion → 只 sed chart version/appVersion
# 消费:helm repo add harbor-chart-repo https://registry.example.com/chartrepo/llm && helm upgrade ... openresty/bodylog --version <tag>
build:chart:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    REGISTRY_PROJECT: llm
  script:
    # openresty chart(image.tag="" 回落 appVersion → 只改 chart version/appVersion,和其余 chart 一致)
    - 'sed -i -E "s/^version:.*/version: ${CI_COMMIT_TAG}/; s/^appVersion:.*/appVersion: \"${CI_COMMIT_TAG}\"/" k8s/helm/openresty/Chart.yaml'
    - export MODULE_NAME=openresty CHART_FOLDER=k8s/helm/openresty
    - push-chart
    # bodylog chart(image.tag="" 回落 appVersion → 只改 chart version/appVersion)
    - 'sed -i -E "s/^version:.*/version: ${CI_COMMIT_TAG}/; s/^appVersion:.*/appVersion: \"${CI_COMMIT_TAG}\"/" k8s/helm/bodylog/Chart.yaml'
    - export MODULE_NAME=bodylog CHART_FOLDER=k8s/helm/bodylog
    - push-chart
    - 'echo "charts pushed: openresty + bodylog ${CI_COMMIT_TAG} → ChartMuseum(harbor-chart-repo)"'
