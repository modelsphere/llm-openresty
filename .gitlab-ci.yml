# 打 tag 自动 build openresty 镜像并 push 到 harbor
#
# 参考同组 chat-engine 惯例:org 共享 `public-buildx` runner —— docker daemon 已内置 harbor 鉴权,
# CI 里不需要 docker login、也不需要配任何 HARBOR_ 变量,直接 docker build + docker push。
# (已在 feat/openresty-k8s-image 上实测跑通:build FROM harbor openresty-base + push harbor 成功。)
#
# app 镜像 FROM harbor 的 openresty-base(见 Dockerfile / Dockerfile.base),纯 COPY 配置、不装东西,
# 所以 public-buildx runner 够不到 docker.io/外网也能 build。
#
# 触发:仅打 git tag。产物 registry.example.com/llm/llm-openresty:<tag> (+ :latest)。
# 生效前提:本文件要在【被打 tag 的 commit】上(先合进 main),再打 tag。

stages: [build]

variables:
  IMAGE: registry.example.com/llm/llm-openresty

build:image:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner(在线;docker 已 login harbor)
  rules:
    - if: '$CI_COMMIT_TAG'         # 只在打 tag 时构建;其它 push 不触发
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
