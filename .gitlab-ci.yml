# 打 tag 自动 build openresty 镜像并 push 到 harbor
#
# 参考同组 chat-engine 的惯例:用 org 共享的 `public-buildx` runner —— 它的 docker daemon
# 已【内置 harbor 鉴权】,所以 CI 里【不需要 docker login、也不需要配任何 HARBOR_ 变量】,
# 直接 docker build + docker push 即可(chat-engine 的 docker/build.sh 也是这么干的)。
#
# 触发:仅在打 git tag 时(`git tag v0.2.0 && git push origin v0.2.0`)。
# 产物:registry.example.com/llm/llm-openresty:<tag>  (+ :latest)
#
# 生效前提:本文件要在【被打 tag 的那个 commit】上 —— 即先把它合进 main,再打 tag。

stages: [build]

variables:
  IMAGE: registry.example.com/llm/llm-openresty

build:image:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner(在线;docker 已 login harbor)
  rules:
    - if: '$CI_COMMIT_TAG'         # 只在打 tag 时构建;其它 push 不触发
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
