# 打 tag 自动 build openresty 镜像并 push 到 harbor
#
# 触发:仅在打 git tag 时(`git tag v0.2.0 && git push origin v0.2.0`)。
# 产物:registry.example.com/llm/llm-openresty:<tag>  (+ :latest)
#
# 用 org 自带的 `dockerBuilder` runner(本机有 docker daemon)——直接 docker build,
# 不需要 kaniko、也不需要任何额外 builder 镜像。
#
# ── 前置(必须先做,否则 pipeline 失败)──
# 1) GitLab 项目 Settings → CI/CD → Variables 里加(Masked + Protected):
#      HARBOR_USER = llm       (建议用 harbor robot 账号)
#      HARBOR_PASS = <harbor 密码 / robot token>
# 2) 这份 .gitlab-ci.yml 要在【被打 tag 的那个 commit】上(即先合进 main),tag pipeline 才会跑。
# 3) dockerBuilder runner 本机 docker 需能:push harbor(内网直连,已确认)+ 构建时拉基础镜像
#      ubuntu:22.04 与 apt 装 openresty(openresty.org)。若该 runner air-gap,把 Dockerfile 基础镜像
#      换成 harbor 内网镜像(或改走离线 deb)。

stages: [build]

variables:
  IMAGE: registry.example.com/llm/llm-openresty

build:image:
  stage: build
  tags: [dockerBuilder]              # 指定到有 docker 的构建 runner
  rules:
    - if: '$CI_COMMIT_TAG'           # 只在打 tag 时构建;其它 push 不触发
  script:
    - echo "$HARBOR_PASS" | docker login registry.example.com -u "$HARBOR_USER" --password-stdin
    - docker build -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
    - docker logout registry.example.com
