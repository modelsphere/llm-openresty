# 打 tag 自动 build 镜像 + push helm chart 到 harbor。
#
# 参考同组 chat-engine 惯例:org 共享 `public-buildx` runner —— docker daemon 已内置 harbor 鉴权,
# CI 里不需要 docker login、也不需要配任何 HARBOR_ 变量,直接 docker build + docker push。
#
# app 镜像用单个 Dockerfile 构建:默认 FROM ubuntu 自己装 OpenResty,CI 则用
# app 镜像:Dockerfile 默认 FROM ubuntu 自己装 OpenResty(开源可用);CI 用
# --build-arg BASE=<harbor>/openresty-base 覆盖成已装好的基础镜像,Dockerfile 检测到
# 后跳过 apt,所以 runner 够不到外网也能 build。
#
# 生效前提:本文件要在【被打 tag 的 commit】上(先合进 main),再打 tag。
#
# ── tag 命名:三个组件可以分别发版 ──────────────────────────────────────────
#
#   openresty/v0.2.0   → 只出 llm-openresty 镜像 + openresty chart
#   bodylog/v0.2.0     → 只出 bodylog-listener 镜像 + bodylog chart
#   exporter/v0.2.0    → 只出 bodylog-exporter 镜像 + bodylog-exporter chart
#   0.1.13             → 三个一起(无前缀,旧习惯,保留)
#
# 产物版本【剥掉前缀】:tag exporter/v0.2.0 → 镜像 :0.2.0 + chart version/appVersion 0.2.0。
# 必须剥 —— Helm 的 chart version 要求合法 SemVer,带前缀会被直接拒。
#
# 为什么要分开:三个组件共用一个 tag 计数器时,改 exporter 也会给 bodylog/openresty
# 各推一个内容完全相同的新版本号(线上 openresty 卡在 0.1.4 而 exporter 已到 0.1.12,
# 就是这么错位的),并且把三个镜像的 :latest 一起挪走 —— 拿 latest 的地方会漂到没测过的构建。
#
# 注:tag 名里的 "/" 不受 push rule 的 branch_name_regex 约束(那条只管分支;本仓无 tag 规则)。

stages: [build]

variables:
  # 镜像地址直写在这里,不走 CI/CD 变量拼接:GitLab 14 不会展开 variables 块内对其它
  # 变量的引用,拼出来是空串,曾导致 `docker build -t :<ver>` 和 `--build-arg BASE=` 都为空。
  # 基础镜像地址则写在各 Dockerfile 的 ARG 默认值里(classic builder 下 --build-arg
  # 覆盖不了 FROM 之前的 ARG,只有默认值生效)。
  IMAGE: harbor.4pd.io/hardcore-tech/llm-openresty
  BODYLOG_IMAGE: harbor.4pd.io/hardcore-tech/bodylog-listener
  EXPORTER_IMAGE: harbor.4pd.io/hardcore-tech/bodylog-exporter

  # 各 Dockerfile 的 ARG 默认值是公网镜像,开源后 `docker build .` 开箱即用;
  # 这里覆盖回 harbor —— runner 够不到 docker.io / openresty.org。写成字面量,
  # 不要引用其它变量:GitLab 14 不展开 variables 块内的变量引用,拼出来是空串。
  OPENRESTY_BUILD_ARGS: >-
    --build-arg BASE=harbor.4pd.io/hardcore-tech/openresty-base:1.29.2.3
  GO_BUILD_ARGS: >-
    --build-arg GO_BASE=harbor.4pd.io/hardcore-tech/golang:1.24-bookworm
    --build-arg RUNTIME_BASE=harbor.4pd.io/hardcore-tech/debian:12-slim
  DOCKER_BUILDKIT: "0"             # 出简单 v2 manifest,containerd 直接拉(buildkit attestation manifest-list 拉取会卡)

# VERSION = tag 剥掉 "<组件>/v" 前缀。无前缀的 tag 剥不掉任何东西,原样通过。
# 三个 ${VAR#pattern} 都写上是因为一个 job 只会命中自己那个,其余是空操作。
# before_script 与 script 在【同一个 shell】里跑,所以 VERSION 传得过去。
.build-job:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner(在线;docker 已 login harbor)
  before_script:
    - 'VERSION="${CI_COMMIT_TAG#openresty/v}"; VERSION="${VERSION#bodylog/v}"; VERSION="${VERSION#exporter/v}"'
    # 预发布 tag(SemVer 的 "-" 后缀,如 0.1.14-slo-rc1)**不动 :latest** —— RC 是拿去测试集群
    # 验证用的,不该变成「没指定版本时默认拿到的那个」。正式版照旧同时推 :latest。
    - 'case "$VERSION" in *-*) PRERELEASE=1 ;; *) PRERELEASE= ;; esac'
    - 'echo "tag=$CI_COMMIT_TAG → version=$VERSION prerelease=${PRERELEASE:-0}"'

# 各组件的触发条件。两条 rule:带自己前缀的 tag,或无前缀的 tag(三个一起)。
# 都不匹配 → 该 job 不进 pipeline(所以 openresty/v* 那次根本不会去编 bodylog 的 CGO)。
.on-openresty:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^openresty\/v[0-9]/'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]/'
.on-bodylog:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^bodylog\/v[0-9]/'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]/'
.on-exporter:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^exporter\/v[0-9]/'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]/'

build:openresty:
  extends: [.build-job, .on-openresty]
  script:
    # --pull:不复用本地既有层,确保 FROM 按 --build-arg 重新解析
    - docker build --pull $OPENRESTY_BUILD_ARGS -t "$IMAGE:$VERSION" .
    - docker push "$IMAGE:$VERSION"
    # 预发布跳过 :latest(见 .build-job 的 PRERELEASE)
    - if [ -z "$PRERELEASE" ]; then docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi

# bodylog-listener 镜像:多阶段 FROM harbor golang:1.24 编 CGO(go-duckdb)→ harbor debian:12-slim。
# 与 openresty 不同,bodylog 要真编译:go module 从阿里云 goproxy 拉(runner 需能到 mirrors.aliyun.com);
# 若 runner 彻底离线,改 `go mod vendor` 入库 + Dockerfile 加 -mod=vendor。base(golang/debian)都在 harbor。
build:bodylog:
  extends: [.build-job, .on-bodylog]
  script:
    - docker build --pull -f Dockerfile.bodylog $GO_BUILD_ARGS -t "$BODYLOG_IMAGE:$VERSION" .
    - docker push "$BODYLOG_IMAGE:$VERSION"
    # 预发布跳过 :latest(见 .build-job 的 PRERELEASE)
    - if [ -z "$PRERELEASE" ]; then docker tag "$BODYLOG_IMAGE:$VERSION" "$BODYLOG_IMAGE:latest" && docker push "$BODYLOG_IMAGE:latest"; fi

# bodylog-exporter 镜像:纯 Go(CGO off)静态二进制,tail 明细 jsonl → Prometheus。
# 构建上下文 = bodylog-exporter-go/(与 bodylog-listener 隔离,自带 go.mod/go.sum);module 走腾讯 goproxy。
build:exporter:
  extends: [.build-job, .on-exporter]
  script:
    - docker build --pull -f bodylog-exporter-go/Dockerfile $GO_BUILD_ARGS -t "$EXPORTER_IMAGE:$VERSION" bodylog-exporter-go
    - docker push "$EXPORTER_IMAGE:$VERSION"
    # 预发布跳过 :latest(见 .build-job 的 PRERELEASE)
    - if [ -z "$PRERELEASE" ]; then docker tag "$EXPORTER_IMAGE:$VERSION" "$EXPORTER_IMAGE:latest" && docker push "$EXPORTER_IMAGE:latest"; fi

# helm chart 打包 + push,用 public-buildx runner 内置的 push-chart(org 标准,参考 llm-monitor CI 实测)。
# push-chart 自处理 harbor ChartMuseum 鉴权(cm-push 到 harbor-chart-repo)。
# 三个 chart 各自一个 job:除了能分别触发,也不再是「第一个 push 失败带走后两个」。
# 三个 chart 的 values.yaml 都是 image.tag="" → 回落 appVersion,所以只 sed chart 的 version/appVersion。
.chart-job:
  extends: .build-job
  variables:
    REGISTRY_PROJECT: hardcore-tech

chart:openresty:
  extends: [.chart-job, .on-openresty]
  script:
    - 'sed -i -E "s/^version:.*/version: ${VERSION}/; s/^appVersion:.*/appVersion: \"${VERSION}\"/" k8s/helm/openresty/Chart.yaml'
    - export MODULE_NAME=openresty CHART_FOLDER=k8s/helm/openresty
    - push-chart

chart:bodylog:
  extends: [.chart-job, .on-bodylog]
  script:
    - 'sed -i -E "s/^version:.*/version: ${VERSION}/; s/^appVersion:.*/appVersion: \"${VERSION}\"/" k8s/helm/bodylog/Chart.yaml'
    - export MODULE_NAME=bodylog CHART_FOLDER=k8s/helm/bodylog
    - push-chart

# bodylog-exporter chart 独立于 bodylog listener,复用 bodylog-exporter 镜像。
chart:exporter:
  extends: [.chart-job, .on-exporter]
  script:
    - 'sed -i -E "s/^version:.*/version: ${VERSION}/; s/^appVersion:.*/appVersion: \"${VERSION}\"/" k8s/helm/bodylog-exporter/Chart.yaml'
    - export MODULE_NAME=bodylog-exporter CHART_FOLDER=k8s/helm/bodylog-exporter
    - push-chart
